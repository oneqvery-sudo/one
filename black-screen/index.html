<!--자바스크립트-->

<script>
const container = document.querySelector('.artwork-container');
const artworks = document.querySelectorAll('.artwork');


    function updateSpaces() {
        const first = artworks[0];
        const last = artworks[artworks.length - 1];

        const startSpace = Math.max(
            0,
            (container.clientWidth - first.offsetWidth) / 2
        );

        const endSpace = Math.max(
            0,
            (container.clientWidth - last.offsetWidth) / 2
        );

        container.style.setProperty('--start-space', `${startSpace}px`);
        container.style.setProperty('--end-space', `${endSpace}px`);
    }

    // 휠
    let wheelLocked = false;

    container.addEventListener('wheel', (e) => {
        e.preventDefault();

        // 이동 애니메이션 중에는 추가 입력 방지
        if (wheelLocked) return;

        const activeArtwork = document.querySelector('.artwork.active');
        const currentIndex = Array.from(artworks).indexOf(activeArtwork);

        if (currentIndex === -1) return;

        // 휠 방향에 따라 다음 또는 이전 작품 선택
        const direction = e.deltaY > 0 ? 1 : -1;
        const nextIndex = Math.max(
            0,
            Math.min(artworks.length - 1, currentIndex + direction)
        );

        if (nextIndex === currentIndex) return;

        wheelLocked = true;

        centerArtwork(artworks[nextIndex]);

        // 이동이 끝나면 다음 휠 입력 허용
        setTimeout(() => {
            wheelLocked = false;
        }, 1100);

    }, { passive: false });



function updateMovingLight() {
    const light = document.querySelector('#moving-light');
    const containerRect = container.getBoundingClientRect();

    // 각 작품의 실제 중앙 좌표 계산
    const centers = Array.from(artworks).map(artwork => {
        const rect = artwork.getBoundingClientRect();

        return rect.left - containerRect.left
            + container.scrollLeft
            + rect.width / 2;
    });

    // 현재 화면 중앙의 콘텐츠 좌표
    const currentCenter =
        container.scrollLeft + container.clientWidth / 2;

    let x = centers[0];
    let progress = 0;

    // 현재 위치가 어느 두 역 사이인지 계산
    for (let i = 0; i < centers.length - 1; i++) {
        if (currentCenter >= centers[i]
            && currentCenter <= centers[i + 1]) {

            progress =
                (currentCenter - centers[i])
                / (centers[i + 1] - centers[i]);

            x = centers[i]
                + (centers[i + 1] - centers[i]) * progress;

            break;
        }

        if (currentCenter > centers[i + 1]) {
            x = centers[i + 1];
        }
    }

    // 역에 가까워질수록 빛의 길이를 줄임
    const length = 40 * Math.min(progress, 1 - progress) * 2;

    light.setAttribute('x1', x - length / 2);
    light.setAttribute('x2', x + length / 2);
    light.style.opacity = length < 2 ? 0 : 1;
}

function updateMapPosition() {
    const map = document.querySelector('.map-track');
    const svg = map.querySelector('svg');
    const line = document.querySelector('#map-line');
    const stations = document.querySelectorAll('.map-station');

    const containerRect = container.getBoundingClientRect();
    const mapWidth = container.scrollWidth;

    // 노선도의 너비를 작품 전체 영역에 맞춤
    map.style.width = `${mapWidth}px`;
    svg.setAttribute('width', mapWidth);
    svg.setAttribute('viewBox', `0 0 ${mapWidth} 100`);


    const centers = Array.from(artworks).map(artwork => {
    const rect = artwork.getBoundingClientRect();

        return rect.left - containerRect.left
            + container.scrollLeft
            + rect.width / 2;
    });

    // 각 역을 해당 작품의 중앙에 배치
    centers.forEach((x, index) => {
    stations[index].setAttribute(
            'transform',
            `translate(${x}, 0)`
        );
    });

    // 노선의 시작점과 끝점도 작품 위치에 맞춤
    const lineStart = Math.max(centers[0], 180);

    line.setAttribute('x1', lineStart);
    line.setAttribute('x2', centers[centers.length - 1]);



    // 작품 스크롤과 같은 거리만큼 노선도 이동
    map.style.transform =
        `translateX(${-container.scrollLeft}px)`;
}

function updateActiveArtwork() {
    const center = container.getBoundingClientRect().left
        + container.clientWidth / 2;

    let closestArtwork = null;
    let minDistance = Infinity;

    artworks.forEach(artwork => {
        const rect = artwork.getBoundingClientRect();
        const artworkCenter = rect.left + rect.width / 2;
        const distance = Math.abs(center - artworkCenter);

        if (distance < minDistance) {
            minDistance = distance;
            closestArtwork = artwork;
        }
    });

    const stations = document.querySelectorAll('.map-station');

    artworks.forEach((artwork, index) => {
        const isActive = artwork === closestArtwork;

        artwork.classList.toggle('active', isActive);

        if (stations[index]) {
            stations[index].classList.toggle('active', isActive);
        }
    });

}

let currentStationNumber = (() => {
    const match = location.hash.match(/-(\d+)$/);
    return match ? Number(match[1]) : 1;
})();

function centerArtwork(artwork) {
    const containerRect = container.getBoundingClientRect();
    const artworkRect = artwork.getBoundingClientRect();

    const currentCenter = containerRect.left + container.clientWidth / 2;
    const artworkCenter = artworkRect.left + artworkRect.width / 2;
    const distance = artworkCenter - currentCenter;

    if (Math.abs(distance) < 5) return;

    const start = container.scrollLeft;
    const target = start + distance;
    const duration = 1200;
    const startTime = performance.now();

    function animate(time) {
        const progress = Math.min((time - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);

        container.scrollLeft = start + (target - start) * eased;

        if (progress < 1) {
            requestAnimationFrame(animate);
        }

        else {
            const match = artwork.id.match(/-(\d+)$/);

            if (match) {
                currentStationNumber = Number(match[1]);
            }
        }

    }

    requestAnimationFrame(animate);
}

function goToArtwork(index) {
    centerArtwork(artworks[index]);
}

window.addEventListener("load", () => {
    const params = new URLSearchParams(window.location.search);
    const artworkIndex = Number(params.get("artwork"));

    if (params.has("artwork") && artworks[artworkIndex]) {
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                goToArtwork(artworkIndex);
            });
        });
    }
});


    let scrollTimer;

    //스크롤
    let updateFrame = null;

    container.addEventListener('scroll', () => {
        if (updateFrame) return;

        updateFrame = requestAnimationFrame(() => {
            updateActiveArtwork();
            updateMovingLight();
            updateMapPosition();

            updateFrame = null;
        });
    });

// 메인페이지에서 선택한 작품을 화면 중앙에 배치
window.addEventListener("load", () => {
    const targetId = location.hash.substring(1);

    if (!targetId) return;

    const container = document.querySelector(".artwork-container");
    const target = document.getElementById(targetId);

    if (!container || !target) return;

    requestAnimationFrame(() => {
        const containerRect = container.getBoundingClientRect();
        const targetRect = target.getBoundingClientRect();

        const moveX =
            targetRect.left - containerRect.left
            + targetRect.width / 2
            - container.clientWidth / 2;

        container.scrollLeft += moveX;
    });
});

























// 메인페이지로 돌아가는 전환 모션
async function transitionToMain() {
    const screen = document.querySelector(".transition-screen");

    if (!screen) {
        location.href = "../index.html";
        return false;
    }

        // 현재 페이지의 노선도 이름과 역 번호 확인
    const hash = location.hash;

    const match = hash.match(
        /(relation|tree|black_light|black_screen|black|yin)(?:_yang)?-?(\d+)/
    );

    const routeName = match ? match[1] : "relation";
    const target = match ? Number(match[2]) : 1;

    const actualRouteName = {
        "black_light": "black",
        "black_screen": "black-screen"
    }[routeName] || routeName;

    // 현재 페이지에 해당하는 노선도 선택
    const routeScene = screen.querySelector(
        `.${actualRouteName}-transition`
    );

    const caption = screen.querySelector(".transition-caption");
    const seriesIntro = screen.querySelector(".black-screen-series-intro");

    const blackScreenCaptions = [
        "관찰",
        "도출",
        "탐색",
        "확장"
    ];

    const mainScene = screen.querySelector(".main-transition");
    const projectPoint = screen.querySelector(".main-project-point");

    if (!routeScene) {
        location.href = "../index.html";
        return false;
    }

    const stations = [
        ...routeScene.querySelectorAll(
            ".start-point, .station-point, .end-point, .non-interactive"
        )
    ];

    const lightLine = routeScene.querySelector(".light-line");

    if (!lightLine || !stations.length || !mainScene || !projectPoint) {
        location.href = "../index.html";
        return false;
    }

    const actualTarget = Math.min(
        Math.max(1, currentStationNumber),
        stations.length
    );

    // 모든 노선도 숨기기
    screen.querySelectorAll("svg").forEach(svg => {
        svg.style.display = "none";
    });

    // 현재 노선도와 메인 노선도 표시
    routeScene.style.display = "block";
    mainScene.style.display = "block";

    routeScene.style.opacity = 1;
    mainScene.style.opacity = 0;
    mainScene.style.visibility = "visible";

    screen.classList.remove("play", "reverse");
    screen.style.display = "flex";

    void screen.offsetWidth;

    // 노선의 길이 계산
    const totalLength = lightLine.getTotalLength();

    const stationLengths = stations.map(station => {
        const cx = Number(station.getAttribute("cx"));
        const cy = Number(station.getAttribute("cy"));

        let closestLength = 0;
        let minDistance = Infinity;

        for (let i = 0; i <= 2000; i++) {
            const length = totalLength * i / 2000;
            const point = lightLine.getPointAtLength(length);

            const distance = Math.hypot(
                point.x - cx,
                point.y - cy
            );

            if (distance < minDistance) {
                minDistance = distance;
                closestLength = length;
            }
        }

        return closestLength;
    });

    // 역 반짝임
    const blink = station => new Promise(resolve => {
        const animation = station.animate(
            [
                { fill: "#f5a623" },
                { fill: "black" },
                { fill: "#f5a623" },
                { fill: "black" }
            ],
            {
                duration: 1800,
                fill: "forwards"
            }
        );

        animation.onfinish = () => {
            station.style.fill = "black";
            animation.cancel();
            resolve();
        };
    });

    // 빛 이동
    const move = (from, to) => new Promise(resolve => {
        const dashLength = 5;

        const start = -(stationLengths[from] - dashLength / 2);
        const end = -(stationLengths[to] - dashLength / 2);

        lightLine.style.strokeDasharray =
            `${dashLength} ${totalLength}`;

        lightLine.style.strokeDashoffset = start;
        lightLine.style.opacity = 1;

        const animation = lightLine.animate(
            [
                { strokeDashoffset: start },
                { strokeDashoffset: end }
            ],
            {
                duration: 700,
                easing: "linear",
                fill: "forwards"
            }
        );

        animation.onfinish = () => {
            lightLine.style.strokeDashoffset = end;
            lightLine.style.opacity = 0;
            animation.cancel();
            resolve();
        };
    });

    // 노선 초기화
    lightLine.style.strokeDasharray = `5 ${totalLength}`;
    lightLine.style.strokeDashoffset = 0;
    lightLine.style.opacity = 0;

    stations.forEach(station => {
        station.style.fill = "black";
    });

    // 현재 역에서 첫 번째 역까지 역순으로 이동
    for (let i = actualTarget - 1; i >= 0; i--) {

        if (i < actualTarget - 1) {
            await move(i + 1, i);
        }

    // 작품 설명 변경
    if (caption) {
        caption.style.transition = "none";
        caption.textContent = blackScreenCaptions[i];
        caption.style.opacity = 1;
    }
        await blink(stations[i]);
    }


    // 노선도와 위아래 설명을 동시에 사라지게 하기
    routeScene.style.transition = "opacity 400ms ease";
    caption.style.transition = "opacity 400ms ease";
    seriesIntro.style.transition = "opacity 400ms ease";

    routeScene.style.opacity = 0;
    caption.style.opacity = 0;
    seriesIntro.style.opacity = 0;

    await new Promise(resolve => setTimeout(resolve, 450));

    // 세 요소가 사라질 때까지 대기
    await new Promise(resolve => setTimeout(resolve, 500));

    // 주제 설명 초기화
    if (seriesIntro) {
        seriesIntro.style.display = "none";
    }
































    

    // 랜덤 글귀 설정
    const quoteBox = screen.querySelector(".random-quote");

    const quotes = [
        "사유",
        "대화",
        "연결",
        "정보",
        "해석",
        "관찰",
        "기억",
        "관계",
        "확장",
        "파생",
        "시선",
        "흔적",
        "가능성",
        "되돌아보기",
        "정보수집가",

        "익숙한 것을 다시 바라보기.",
        "하나의 생각에서 또 다른 생각으로.",
        "서로 다른 관점이 만나 새로운 의미를 만든다.",
        "지나간 이야기에서 새로운 가능성을 발견한다.",
        "사소한 정보가 생각의 시작이 되기도 한다.",
        "대화는 새로운 생각을 만들어 낸다.",
        "작품을 바라보는 또 하나의 시선.",
        "하나의 이미지에서 여러 이야기가 파생된다.",
        "생각은 서로 연결되고 확장된다.",
        "처음의 질문으로 다시 돌아가기.",
        "작품을 통해 나의 생각을 건네다.",
        "익숙한 대상에 새로운 의미를 부여하다.",

        "그림은 세계를 이해하고 해석하는 매개체가 될 수 있다.",
        "나의 사고방식 자체를 작품의 일부로 받아들이다.",
        "중요하지 않다고 여겼던 정보가 일상에 영향을 미치기도 한다.",
        "타인과 의견을 주고받으며 사고를 확장하다.",
        "작품은 내가 감상자에게 건네는 말과 같다.",
        "작품과 대화를 나누며 처음에는 생각하지 못했던 이야기를 만들어 간다.",
        "처음 작업을 시작했을 때의 마음을 다시 떠올리다.",
        "작품을 오래 바라보고 생각하는 태도.",
        "감상자 자신만의 사유를 이어 가다.",
        "지나간 이야기로 돌아가 새로운 이야기를 시작하다."
    ];
    const randomIndex = Math.floor(Math.random() * quotes.length);

    // 글귀 내용과 종류 설정
    if (quoteBox) {
        const selectedQuote = quotes[randomIndex];

        quoteBox.textContent = selectedQuote;

        if (selectedQuote.length <= 10 && !selectedQuote.includes(".")) {
            quoteBox.className = "random-quote word";
        } else {
            quoteBox.className = "random-quote sentence";
        }

        quoteBox.style.transition = "none";
        quoteBox.style.opacity = 0;
    }

    // 메인 노선도와 랜덤 글귀 등장
    mainScene.style.visibility = "visible";
    mainScene.style.transition = "opacity 500ms ease";

    void mainScene.getBoundingClientRect();

    if (quoteBox) {
        quoteBox.style.transition = "opacity 500ms ease";
    }

    mainScene.style.opacity = 1;

    if (quoteBox) {
        quoteBox.style.opacity = 1;
    }

    await new Promise(resolve => setTimeout(resolve, 550));

    // 오른쪽에서 프로젝트 역으로 빛 이동
    const mainLight = mainScene.querySelector(".main-light-line");
    const mainTotalLength = mainLight.getTotalLength();

    const dashLength = 5;

    const start = -(mainTotalLength - dashLength / 2);
    const end = -(dashLength / 2);

    mainLight.style.strokeDasharray =
        `${dashLength} ${mainTotalLength}`;

    mainLight.style.strokeDashoffset = start;
    mainLight.style.opacity = 1;

    const lightAnimation = mainLight.animate(
        [
            { strokeDashoffset: start },
            { strokeDashoffset: end }
        ],
        {
            duration: 1000,
            easing: "linear",
            fill: "forwards"
        }
    );

    await lightAnimation.finished;

    mainLight.style.opacity = 0;
    lightAnimation.cancel();

    // 프로젝트 역 세 번 깜빡이기
    const projectBlink = projectPoint.animate(
        [
            { fill: "#f5a623" },
            { fill: "black" },
            { fill: "#f5a623" },
            { fill: "black" }
        ],
        {
            duration: 2000,
            easing: "ease-in-out",
            fill: "forwards"
        }
    );

    await projectBlink.finished;

    projectPoint.style.fill = "black";
    projectBlink.cancel();

    // 메인 노선도와 랜덤 글귀 부드럽게 사라지기
    mainScene.style.transition = "opacity 1000ms ease";
    mainScene.style.opacity = 0;

    if (quoteBox) {
        quoteBox.style.transition = "opacity 1000ms ease";
        quoteBox.style.opacity = 0;
    }

    await new Promise(resolve => setTimeout(resolve, 2000));
    
    
    // 메인페이지로 이동
    location.href = "../index.html";

    return false;
}




window.addEventListener('load', () => {
    updateActiveArtwork();
    updateSpaces();
    updateMovingLight();
    updateMapPosition();
});

window.addEventListener('resize', () => {
    updateSpaces();
    updateMovingLight();
});





</script>




</body>
</html>
