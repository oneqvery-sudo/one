<button id="reset-button">↺</button>












<!--자바스크립트-->


<!--메인화면드래그이동기능-->
<script>
const container = document.querySelector(".map-container");

let isDragging = false;
let startX;
let startY;
let scrollLeft;
let scrollTop;
let hasDragged = false;

container.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;

    isDragging = true;
    hasDragged = false;

    startX = e.clientX;
    startY = e.clientY;

    scrollLeft = container.scrollLeft;
    scrollTop = container.scrollTop;
});

container.addEventListener("pointermove", (e) => {
    if (!isDragging) return;

    const moveX = e.clientX - startX;
    const moveY = e.clientY - startY;
    if (Math.abs(moveX) > 5 || Math.abs(moveY) > 5) {
    hasDragged = true;
}

    container.scrollLeft = scrollLeft - moveX;
    container.scrollTop = scrollTop - moveY;
});

container.addEventListener("pointerup", () => {
    isDragging = false;
});

container.addEventListener("pointerleave", () => {
    isDragging = false;
});


// 노선도 확대 및 축소
const map = document.querySelector(".map");

let scale = 1;

container.addEventListener("wheel", (e) => {
    e.preventDefault();

    // 마우스 위치 확인
    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    // 확대 또는 축소 비율 결정
    const oldScale = scale;

    if (e.deltaY < 0) {
        scale = Math.min(scale * 1.1, 3);
    } else {
        scale = Math.max(scale / 1.1, 0.5);
    }

    // 노선도 크기 변경
    map.style.width = (1400 * scale) + "px";

    // 마우스 위치를 중심으로 화면 이동
    const ratio = scale / oldScale;

    container.scrollLeft =
        (container.scrollLeft + mouseX) * ratio - mouseX;

    container.scrollTop =
        (container.scrollTop + mouseY) * ratio - mouseY;

}, { passive: false });


// 노선도 초기화
const resetButton = document.querySelector("#reset-button");

resetButton.addEventListener("click", () => {
    scale = 1;

    map.style.width = "1400px";

    setInitialView();
});


// 처음 화면을 프로젝트_땅을 가르는 기준 역에 맞추기
const mapLeft = 1000;
const mapTop = 1000;

function setInitialView() {
    const stationX = 140 * (1400 / 1031);
    const stationY = 657 * (1400 / 1031);

    container.scrollLeft =
        mapLeft + stationX - container.clientWidth / 2;

    container.scrollTop =
        mapTop + stationY - container.clientHeight / 2;
}

window.addEventListener("load", setInitialView);




</script>
