<!--자바스크립트-->

<script>


//메인화면드래그이동기능
const container = document.querySelector(".map-container");

let isDragging = false;
let startX;
let startY;
let scrollLeft;
let scrollTop;
let hasDragged = false;

container.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;

    isDragging = true;
    hasDragged = false;

    startX = e.clientX;
    startY = e.clientY;

    scrollLeft = container.scrollLeft;
    scrollTop = container.scrollTop;
});

container.addEventListener("pointermove", (e) => {
    if (!isDragging) return;

    const moveX = e.clientX - startX;
    const moveY = e.clientY - startY;
    if (Math.abs(moveX) > 5 || Math.abs(moveY) > 5) {
        hasDragged = true;

        document.querySelector("#intro-text")?.classList.add("hidden");
    }

    container.scrollLeft = scrollLeft - moveX;
    container.scrollTop = scrollTop - moveY;
});

container.addEventListener("pointerup", () => {
    isDragging = false;
});

container.addEventListener("pointerleave", () => {
    isDragging = false;
});


//메인페이지 글자 숨기기
function hideIntroText() {
    const intro = document.getElementById("intro-text");

    if (intro) {
        intro.classList.add("hidden");
    }
}



// 노선도 확대 및 축소
const map = document.querySelector(".map");

let scale = 1;

container.addEventListener("wheel", (e) => {
    e.preventDefault();

    hideIntroText();

    // 마우스 위치 확인
    const rect = container.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;

    // 확대 또는 축소 비율 결정
    const oldScale = scale;

    if (e.deltaY < 0) {
        scale = Math.min(scale * 1.1, 3);
    } else {
        scale = Math.max(scale / 1.1, 0.5);
    }

    // 노선도 크기 변경
    map.style.width = (1600 * scale) + "px";

    // 마우스 위치를 중심으로 화면 이동
    const ratio = scale / oldScale;

    container.scrollLeft =
    mapLeft + (container.scrollLeft + mouseX - mapLeft) * ratio - mouseX;

    container.scrollTop =
    mapTop + (container.scrollTop + mouseY - mapTop) * ratio - mouseY;

}, { passive: false });


// 노선도 초기화
const resetButton = document.querySelector("#reset-button");

resetButton.addEventListener("click", () => {
    scale = 3;

    map.style.width = "4800px";

    setInitialView();

    document.querySelector("#intro-text")?.classList.remove("hidden");
    hasDragged = false;
});

// 처음 화면을 프로젝트_땅을 가르는 기준 역에 맞추기
const mapLeft = 1000;
const mapTop = 1000;

function setInitialView() {
    const mapWidth = 1600 * scale;
    const ratio = mapWidth / 1200;

    const stationX = 140 * ratio;
    const stationY = 657 * ratio;

    container.scrollLeft =
        mapLeft + stationX - container.clientWidth / 2;

    container.scrollTop =
        mapTop + stationY - container.clientHeight / 2;
}

let initialScrollLeft;
let initialScrollTop;

window.addEventListener("load", () => {
    scale = 3;
    map.style.width = (1600 * scale) + "px";

    setInitialView();

    initialScrollLeft = container.scrollLeft;
    initialScrollTop = container.scrollTop;
});





// 서브페이지로 이동하는 전환 모션
let transitionTimer = null;

function transitionTo(url) {
    hideIntroText();

    const screen = document.querySelector(".transition-screen");

    if (!screen) {
        location.href = url;
        return;
    }

    clearTimeout(transitionTimer);

    screen.classList.remove("play", "reverse");
    screen.style.display = "flex";

    void screen.offsetWidth;

    screen.classList.add("play");

    transitionTimer = setTimeout(() => {
        location.href = url;
    }, 10000);
}







</script>
